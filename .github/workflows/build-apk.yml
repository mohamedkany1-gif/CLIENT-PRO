name: Build CLIENT PRO APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png www/
          for f in app-extras.js version.json; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Plugins
        run: npx cap sync android

      - name: Configure Android Launcher Icon
        run: |
          python3 -m pip install --quiet Pillow || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageDraw

          RED = (165, 40, 54, 255)
          WHITE = (255, 255, 255, 255)
          S = 4
          D = "M39 13c-4-3-8-4-13-4C13 9 4 19 4 32s9 23 22 23c5 0 9-1 13-4l-8-9c-2 2-4 3-7 3-7 0-11-5-11-13s4-13 11-13c3 0 5 1 7 3z"
          BARS = [(39, 23, 58, 30), (39, 35, 58, 42)]

          def pts(d):
              t = re.findall(r'[a-zA-Z]|-?\d*\.?\d+', d)
              i = 0; cur = (0, 0); cmd = None; out = []; lc = None
              def n():
                  nonlocal i
                  i += 1
                  return float(t[i - 1])
              while i < len(t):
                  if t[i].isalpha():
                      cmd = t[i]; i += 1
                  if cmd in 'zZ':
                      break
                  if cmd == 'M':
                      cur = (n(), n()); out.append(cur); cmd = 'L'
                  elif cmd in 'lL':
                      x, y = n(), n()
                      cur = (cur[0] + x, cur[1] + y) if cmd == 'l' else (x, y)
                      out.append(cur); lc = None
                  elif cmd in 'cCsS':
                      if cmd in 'cC':
                          a = [(n(), n()) for _ in range(3)]
                          if cmd == 'c':
                              a = [(cur[0] + x, cur[1] + y) for x, y in a]
                          p1, p2, p3 = a
                      else:
                          a = [(n(), n()) for _ in range(2)]
                          if cmd == 's':
                              a = [(cur[0] + x, cur[1] + y) for x, y in a]
                          p1 = (2 * cur[0] - lc[0], 2 * cur[1] - lc[1]) if lc else cur
                          p2, p3 = a
                      for k in range(1, 21):
                          u = k / 20; v = 1 - u
                          out.append((v**3*cur[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u**3*p3[0],
                                      v**3*cur[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u**3*p3[1]))
                      lc = p2; cur = p3
              return out

          C = pts(D)

          def art(canvas, diam, bg=None, disc=True, color=RED):
              W = canvas * S
              im = Image.new('RGBA', (W, W), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if bg == 'rounded':
                  d.rounded_rectangle((0, 0, W - 1, W - 1), radius=int(W * .22), fill=RED)
              elif bg == 'round':
                  d.ellipse((0, 0, W - 1, W - 1), fill=RED)
              if disc:
                  k = diam * S / 62
                  m = lambda x, y: (W / 2 + (x - 32) * k, W / 2 + (y - 32) * k)
                  d.ellipse((W/2 - 31*k, W/2 - 31*k, W/2 + 31*k, W/2 + 31*k), fill=WHITE)
              else:
                  k = diam * S / 54
                  m = lambda x, y: (W / 2 + (x - 31) * k, W / 2 + (y - 32) * k)
              d.polygon([m(*p) for p in C], fill=color)
              for x1, y1, x2, y2 in BARS:
                  d.rectangle((*m(x1, y1), *m(x2, y2)), fill=color)
              return im.resize((canvas, canvas), Image.LANCZOS)

          RES = Path('android/app/src/main/res')

          def put(p, data):
              f = RES / p
              f.parent.mkdir(parents=True, exist_ok=True)
              data.save(f) if hasattr(data, 'save') else f.write_text(data)

          for dn, s in dict(mdpi=48, hdpi=72, xhdpi=96, xxhdpi=144, xxxhdpi=192).items():
              put(f'mipmap-{dn}/ic_launcher.png', art(s, s * .74, 'rounded'))
              put(f'mipmap-{dn}/ic_launcher_round.png', art(s, s * .68, 'round'))
          for dn, s in dict(mdpi=108, hdpi=162, xhdpi=216, xxhdpi=324, xxxhdpi=432).items():
              put(f'mipmap-{dn}/ic_launcher_foreground.png', art(s, s * .60))
          for dn, s in dict(mdpi=24, hdpi=36, xhdpi=48, xxhdpi=72, xxxhdpi=96).items():
              put(f'drawable-{dn}/ic_stat_clientpro.png', art(s, s - 4, disc=False, color=WHITE))

          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          put('mipmap-anydpi-v26/ic_launcher.xml', adaptive)
          put('mipmap-anydpi-v26/ic_launcher_round.xml', adaptive)
          put('values/ic_launcher_background.xml', '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#A52836</color>\n</resources>\n')

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in content:
              content, count = re.subn(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', content, count=1)
              if count == 0:
                  content = content.replace("<application", '<application android:icon="@mipmap/ic_launcher"', 1)
              manifest.write_text(content)
          print("launcher icons done")
          PY

      - name: Configure Notification Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          for name in ("POST_NOTIFICATIONS", "VIBRATE", "USE_EXACT_ALARM", "SCHEDULE_EXACT_ALARM"):
              if "android.permission." + name not in content:
                  tag = '    <uses-permission android:name="android.permission.' + name + '" />'
                  content = content.replace("<application", tag + "\n    <application", 1)

          path.write_text(content)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLIENT-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
